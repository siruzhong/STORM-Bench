[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-thor-pipeline"
version = "0.1.0"
description = "AI2-THOR rollout and evidence-grounded QA construction for STORM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "PyYAML>=6,<7", "Pillow>=10,<13",
  "imageio>=2.31,<3", "imageio-ffmpeg>=0.4.9,<0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.storm" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
