schema_version: 1

render:
  width: 640
  height: 480
  field_of_view: 55
  fps: 20

timing:
  duration_s: 60
  duration_range_s: [55, 65]
  event_count: 10
  first_event_max_s: 4
  last_event_min_s: 50
  max_event_gap_s: 8
  before_lead_s: 1.05
  hidden_lead_s: 0.10
  after_lag_s: 1.20
  event_jitter_s: 0.45

station:
  # Receptacles that occur across iTHOR kitchens, living rooms, bedrooms,
  # and bathrooms.  Empty target_types means any pickupable object on one of
  # these supporting surfaces may become a tracked target.
  surface_types:
    - CounterTop
    - DiningTable
    - StoveBurner
    - CoffeeTable
    - SideTable
    - Chair
    - Sofa
    - TVStand
    - Bed
    - Desk
    - Dresser
    - Shelf
    - Bathtub
    - BathtubBasin
    - Floor
    - HandTowelHolder
    - Sink
    - SinkBasin
    - TowelHolder
  target_types: []
  # Four distinct targets are sufficient because extra opportunities are
  # allocated as a complete disappearance/reappearance pair.
  min_targets: 4
  preferred_distance: 0.78
  min_distance: 0.50
  max_distance: 1.20
  horizons: [8, 12, 16, 20, 25, 30]
  distractor_offsets: [58, -58, 72, -72]
  max_targets: 18
  max_position_candidates: 16
  max_stations_per_target: 3
  max_total_stations: 18

motion:
  preferred_speed_mps: 0.42
  max_segment_speed_mps: 0.85
  min_station_step_m: 0.35
  max_station_step_m: 3.5
  max_station_reuse: 3
  route_candidate_count: 20000
  functional_radius_m: 1.8

camera:
  max_yaw_rate_dps: 210
  max_yaw_accel_dps2: 1000
  turn_window_s: 0.62
  hidden_hold_s: 0.16
  focus_hold_s: 0.50

events:
  enabled_types: [disappear, appear]
  allow_simultaneous: true
  max_simultaneous: 2

quality:
  min_target_pixels: 1400
  min_target_dimension: 28
  min_edge_margin: 4
  max_center_distance: 0.90
  distractor_min_pixels: 160
  distractor_min_objects: 1
  max_stationary_fraction: 0.18
  min_travel_distance_m: 8.0

