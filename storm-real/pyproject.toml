[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-real-pipeline"
version = "0.2.0"
description = "English-prompt pipeline from egocentric videos to grounded revisit QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40,<3", "opencv-python-headless>=4.8,<5"]

[project.scripts]
storm-real = "storm_real_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storm_real_pipeline = ["prompts/*/*.txt"]
