[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-bench"
version = "0.1.0"
description = "Public evaluation harness for the STORM-Bench online video benchmark"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
storm-bench = "storm_bench.cli:main"

[tool.setuptools.packages.find]
include = ["storm_bench*"]
